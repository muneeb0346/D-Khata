services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dkhata
      POSTGRES_USER: dkhata
      POSTGRES_PASSWORD: dkhata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://dkhata:dkhata@db:5432/dkhata
    ports:
      - "3000:3000"

volumes:
  pgdata:
