version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: jsdom
        versions:
          - ">=26"
      - dependency-name: eslint
        versions:
          - ">=10"
      - dependency-name: typescript
        versions:
          - ">=6"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
